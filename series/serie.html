<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Série d'exercices | Zakaria Lazrak</title>
<link rel="icon" href="../assets/icon.jpg">
<script>try { var th = localStorage.getItem('theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th; } catch (e) { /* stockage indisponible */ }</script>
<link rel="stylesheet" href="../assets/katex/katex.min.css">
<style>
  :root { --th: #eef3fb; --sol: #eaf7f1; --ink: #0d1424; --mute: #5b6577; --line: #dfe6f2; --bg: #f3f6fc; --card: #fff; --brand: #1f6fe0; --e1: #12946a; --e2: #d98200; --e3: #d93a4a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; line-height: 1.65; }
  .page { max-width: 860px; margin: 0 auto; padding: 16px 16px 40px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .bar a, .bar button { font: inherit; font-weight: 700; font-size: .88rem; cursor: pointer; border: 0; border-radius: 999px; padding: 8px 16px; color: #fff; background: var(--brand); box-shadow: 0 3px 0 #1550a8; text-decoration: none; }
  .bar .alt { color: var(--ink); background: #fff; border: 1px solid var(--line); box-shadow: 0 3px 0 var(--line); }
  header.head { display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 22px; color: #fff; background: linear-gradient(135deg, #071a44, #0f3a8c 55%, #1366c9); box-shadow: 0 8px 0 #06163a, 0 18px 30px rgba(13, 20, 36, .2); }
  header.head img { width: 92px; height: 92px; border-radius: 18px; background: #fff; flex: none; object-fit: cover; }
  .who { margin: 0; font-size: .85rem; opacity: .85; font-weight: 600; }
  h1 { margin: 2px 0 4px; font-size: clamp(1.3rem, 4vw, 1.9rem); line-height: 1.2; }
  .lvl { margin: 0; font-size: .9rem; font-weight: 700; color: #ffd27a; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; font-size: .85rem; color: var(--mute); }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: .78rem; border-radius: 999px; padding: 2px 10px; color: #fff; }
  .d1 { background: var(--e1); } .d2 { background: var(--e2); } .d3 { background: var(--e3); }
  .exo { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 18px; padding: 16px 18px; margin-top: 16px; box-shadow: 0 5px 0 var(--line); break-inside: avoid; }
  .exo h2 { margin: 0 0 8px; font-size: 1.08rem; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .q { overflow-x: auto; }
  .fig { margin: 10px 0 0; text-align: center; overflow-x: auto; }
  .fig svg { max-width: 100%; height: auto; }
  .tab { border-collapse: collapse; margin: 4px 0 10px; font-size: .9rem; }
  .tab th, .tab td { border: 1px solid #b8c4d8; padding: 4px 8px; text-align: center; }
  .tab th { background: #eef3fb; }
  details { margin-top: 12px; }
  summary { cursor: pointer; font-weight: 700; color: var(--brand); width: fit-content; }
  .s { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: #eaf7f1; overflow-x: auto; }
  footer { margin-top: 26px; text-align: center; font-size: .82rem; color: var(--mute); }
  .katex { font-size: 1.05em; }
  .bar .alt { background: var(--card); } .tab th { background: var(--th); } .s { background: var(--sol); }
  /* mode sombre (réglage de l’appareil ou bouton ☾ du site) ; l’impression reste claire */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #e6ecf8; --mute: #9aa6bf; --line: #26324f; --bg: #0a0f1e; --card: #121a30; --brand: #4d8ff0; --th: #1a2440; --sol: #0f2a22; } }
  :root[data-theme="dark"] { --ink: #e6ecf8; --mute: #9aa6bf; --line: #26324f; --bg: #0a0f1e; --card: #121a30; --brand: #4d8ff0; --th: #1a2440; --sol: #0f2a22; }
  :root[data-theme="dark"] .fig svg, :root:not([data-theme="light"]) .fig svg { background: #fff; border-radius: 10px; }
  @media print {
    body { background: #fff; } :root:not(.x1):not(.x2):not(.x3) { --ink: #0d1424; --mute: #5b6577; --line: #dfe6f2; --card: #fff; --brand: #1f6fe0; --th: #eef3fb; --sol: #eaf7f1; }
    .bar, summary { display: none; }
    .page { padding: 0; max-width: none; }
    header.head { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .exo { box-shadow: none; }
    .tag, header.head { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body:not(.avec) details { display: none; }
    .legend { margin-top: 10px; }
    body.avec details > .s { display: block; }
  }
</style>
</head>
<body>
<div class="page">
  <nav class="bar">
    <a id="back" class="alt" href="../index.html">← Retour au chapitre</a>
    <button id="all" class="alt" type="button">Afficher toutes les corrections</button>
    <a id="d1" href="#" download>⬇ PDF énoncé</a>
    <a id="d2" href="#" download>⬇ PDF avec corrections</a>
    <button id="p1" class="alt" type="button">Imprimer</button>
  </nav>
  <header class="head">
    <img src="../assets/logo.jpg" alt="Zakaria Lazrak — Physique &amp; Chimie">
    <div>
      <p class="who">Zakaria Lazrak — Professeur de Physique-Chimie</p>
      <h1 id="ttl">Série d’exercices</h1>
      <p class="lvl" id="lvl"></p>
    </div>
  </header>
  <div class="legend">Exercices classés du plus facile au plus difficile :
    <span class="tag d1">★ Facile</span><span class="tag d2">★★ Moyen</span><span class="tag d3" id="lab3">★★★ Approfondissement</span></div>
  <main id="list"></main>
  <footer>© Zakaria Lazrak — Professeur de Physique-Chimie · instagram.com/zakarialazrak</footer>
</div>
<script src="../js/verrou.js"></script>
<script src="../contenu/programme.js"></script>
<script src="../contenu/outils.js"></script>
<script src="../js/data.js"></script>
<script src="../js/data-chimie.js"></script>
<script src="../js/exos.js"></script>
<script src="../js/exos-tc.js"></script>
<script src="../js/exos-1bac.js"></script>
<script src="../js/exos-2bac.js"></script>
<script src="../js/exos-plus.js"></script>
<script src="../js/exos-tc2.js"></script>
<script src="../js/exos-1bac2.js"></script>
<script src="../js/exos-2bac2.js"></script>
<script>
  (function () {
    var id = (location.search.match(/[?&]c=([\w-]+)/) || [])[1] || '';
    var lesson = null, level = null;
    LEVELS.forEach(function (lv) { lv.domains.forEach(function (d) { d.lessons.forEach(function (l) { if (l.id === id) { lesson = l; level = lv; } }); }); });
    var list = EXOS[id] || [];
    var lab = ['', '★ Facile', '★★ Moyen', id.indexOf('2b') === 0 ? '★★★ Type Bac' : '★★★ Approfondissement'], col = ['', 'var(--e1)', 'var(--e2)', 'var(--e3)'];
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    if (lesson) {
      document.getElementById('ttl').textContent = 'Série d’exercices — ' + lesson.fr;
      document.getElementById('lvl').textContent = level.fr + ' · ' + list.length + ' exercices corrigés';
      document.getElementById('back').href = '../index.html#/chapitre/' + id + '/series';
      document.getElementById('d1').href = 'pdf/' + id + '.pdf';
      document.getElementById('d2').href = 'pdf/' + id + '-corrige.pdf';
      document.title = 'Série — ' + lesson.fr + ' | Zakaria Lazrak';
    }
    if (id.indexOf('2b') === 0) document.getElementById('lab3').textContent = '★★★ Type Bac';
    var sorted = list.slice().sort(function (a, b) { return a.d - b.d; });
    document.getElementById('list').innerHTML = sorted.length ? sorted.map(function (e, n) {
      return '<section class="exo" style="--c:' + col[e.d] + '"><h2>Exercice ' + (n + 1) + ' — ' + esc(e.t) + ' <span class="tag d' + e.d + '">' + lab[e.d] + '</span></h2>' +
        '<div class="q">' + e.q + '</div>' + (e.fig ? '<figure class="fig">' + e.fig + '</figure>' : '') + '<details><summary>Afficher la correction</summary><div class="s">' + e.s + '</div></details></section>';
    }).join('') : '<p>Aucune série pour ce chapitre pour l’instant.</p>';
    var open = false;
    // corrections réservées : code du professeur (sauf génération des PDF par les outils : ?pdf=1)
    var tool = /[?&]pdf=1/.test(location.search), V = function () { return tool || !window.VERROU || VERROU.ok(); };
    var MSG = 'Les corrections sont réservées : entrez le code donné par le professeur.';
    document.querySelectorAll('details summary').forEach(function (s) { s.addEventListener('click', function (ev) { if (V() || s.parentNode.open) return; ev.preventDefault(); VERROU.ask(function () { s.parentNode.open = true; }, null, MSG); }); });
    document.getElementById('d2').addEventListener('click', function (ev) { if (V()) return; ev.preventDefault(); var a = this; VERROU.ask(function () { a.click(); }, null, MSG); });
    document.getElementById('all').addEventListener('click', function () {
      var b = this; if (!open && !V()) { VERROU.ask(function () { b.click(); }, null, MSG); return; }
      open = !open;
      document.querySelectorAll('details').forEach(function (d) { d.open = open; });
      this.textContent = open ? 'Masquer les corrections' : 'Afficher toutes les corrections';
    });
    document.getElementById('p1').addEventListener('click', function () { document.body.classList.remove('avec'); window.print(); });
    if (/[?&]cor=1/.test(location.search) && V()) { open = true; document.body.classList.add('avec'); document.querySelectorAll('details').forEach(function (d) { d.open = true; }); }
    if (/[?&]pdf=1/.test(location.search)) document.body.classList.add('pdf');
  })();
</script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/auto-render.min.js"></script>
<script>
  // formules avec KaTeX ; window.__ready = true quand tout est prêt (utilisé par tools/*.js pour les PDF)
  renderMathInElement(document.body, { delimiters: [{ left: '\\(', right: '\\)', display: false }, { left: '\\[', right: '\\]', display: true }], throwOnError: false, strict: false });
  
  window.__ready = true;
</script>
</body>
</html>
