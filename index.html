<script>

<script src="assets/mathjax/tex-svg.js" async></script>
<script>
  // Chargement des fichiers du site avec le numéro de version lu dans version.txt :
  // après une mise à jour, les élèves reçoivent tout de suite les nouveaux fichiers (pas d'ancienne copie en cache).
  (function () {
    var files = ['js/sims.js', 'js/sims-chimie.js', 'js/data.js', 'js/data-chimie.js', 'js/extra.js', 'js/resume.js', 'js/series.js', 'js/app.js'];
    var show = function () { document.body.style.visibility = 'visible'; };
    function load(v) {
      var q = v ? '?v=' + encodeURIComponent(v) : '';
      var css = document.getElementById('css'); css.onload = css.onerror = show; css.href = 'css/style.css' + q;
      files.forEach(function (f) { var s = document.createElement('script'); s.src = f + q; s.async = false; document.body.appendChild(s); });
      setTimeout(show, 2500);
    }
    try {
      fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (t) { load(t.trim().slice(0, 40)); }, function () { load(''); });
    } catch (e) { load(''); }
  })();
</script>
